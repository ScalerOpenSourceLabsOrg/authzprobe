name: 🐛 Bug report
description: Something isn't working as expected
title: "[bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! Please fill this out so we can reproduce it.
        **Do not include real secrets, tokens, or credentials** — redact them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: I ran a scan and ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command, and a minimal spec/config if possible (redacted).
      placeholder: |
        1. authzprobe scan --spec ... --config ...
        2. ...
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AuthzProbe version / commit
      placeholder: "0.1.0 or commit sha"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "node --version"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Console output or the JSON report. Redact secrets.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: I removed any real credentials/secrets from this report.
          required: true
